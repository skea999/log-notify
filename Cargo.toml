[package]
name = "log-notify"
version = "0.1.0"
edition = "2024"
license = "ISC"
authors = ["skea999 <skea999@users.noreply.github.com>"]
repository = "https://github.com/skea999/log-notify"
description = "Tail log files, match regex patterns, and emit freedesktop desktop notifications"
readme = "README.md"
keywords = ["linux", "daemon", "notifications", "logs", "security"]
categories = ["command-line-utilities", "system-tools"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# This is a CLI/daemon: stdout and stderr are part of the interface.
print_stdout = "allow"
print_stderr = "allow"
exit = "allow"
too_many_lines = "allow"
large_futures = "allow"
multiple_crate_versions = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
must_use_candidate = "allow"
suspicious_operation_groupings = "allow"
significant_drop_tightening = "allow"
format_push_string = "allow"
assert_is_empty = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
